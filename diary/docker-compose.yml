# Diary Companion — deployment on DaServer
# Deploy location: /mnt/docker/appdata/diary-companion/
#   docker compose up -d
#
# Requires: Lemonade running (per DaServer.md AI stack) and Nextcloud AIO Apache reachable.

services:
  diary-companion:
    build: .
    image: diary-companion:0.1.3
    container_name: diary-companion
    restart: unless-stopped
    ports:
      - "8010:8010"          # LAN-only; expose via Cloudflare Tunnel + Access auth later
    env_file:
      - .env
    volumes:
      # SQLite (vector index + write-ahead journal). Back this up alongside appdata.
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      # Authed probe: /api/health 401s once DIARY_AUTH_TOKEN is set (same fix as
      # the cowork sidecar's compose override). Sends the bearer header when the
      # token env is present, plain probe otherwise.
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; h={'Authorization':'Bearer '+os.environ.get('DIARY_AUTH_TOKEN','')} if os.environ.get('DIARY_AUTH_TOKEN') else {}; print(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8010/api/health', headers=h), timeout=5).status)\""]
      interval: 60s
      timeout: 10s
      retries: 3
