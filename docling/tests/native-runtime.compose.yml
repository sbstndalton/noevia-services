services:
  # noevia#1071: the native server is the only owner, with the image's own setting (default)
  # and with the selector set explicitly the way the deployment sets it (explicit).
  default:
    image: noevia-docling:ci
    network_mode: none
    read_only: true
    user: "65534:65534"
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,size=536870912,mode=1777"]
  explicit:
    image: noevia-docling:ci
    network_mode: none
    read_only: true
    user: "65534:65534"
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,size=536870912,mode=1777"]
    environment:
      NOEVIA_DOCLING_IMPL: rust
