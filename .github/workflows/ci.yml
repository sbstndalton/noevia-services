name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  diary:
    name: Diary test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws/services/diary
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/, the OCR test reading server/pdf-reduce.cjs) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          path: sib/noevia-core
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-services
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # tenant-assertion (the only tenant signature check since noevia#1071, TENANT_ASSERTION_IMPL is retired)
      # at the Dockerfile's pinned noevia-rs ref, which must equal the OCR and model-manager pins; the fixture
      # table must be byte-identical to noevia-rs' copy, and the suite (built after the leaf, below) runs with
      # the binary and TENANT_ASSERTION_REQUIRED=1, so a missing binary fails the tenant tests instead of skipping them.
      - name: Diary pins the same noevia-rs as OCR and model-manager
        run: |
          set -euo pipefail
          for k in NOEVIA_RS_REF NOEVIA_RS_SHA256; do
            a=$(sed -n "s/^ARG $k=//p" Dockerfile); b=$(sed -n "s/^ARG $k=//p" ../ocr/Dockerfile)
            [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::diary/Dockerfile $k ($a) != ocr/Dockerfile ($b)"; exit 1; }
          done
      - name: Fetch noevia-rs at the pinned ref
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG NOEVIA_RS_REF=//p' Dockerfile)
          sum=$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' Dockerfile)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Dockerfile NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          curl -fsSL -o /tmp/noevia-rs.tar.gz "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$ref"
          echo "$sum  /tmp/noevia-rs.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/noevia-rs"
          tar -xzf /tmp/noevia-rs.tar.gz -C "$RUNNER_TEMP/noevia-rs" --strip-components=1
      # noevia#1318 step 2: this repo no longer serves gpu-exec-probe, so the pinned native model
      # manager must not ask for it (noevia-rs#192). All five Dockerfiles share this pin.
      - name: Pinned noevia-rs does not call the removed GPU exec probe
        run: |
          set -euo pipefail
          if grep -rn "gpu-exec-probe" "$RUNNER_TEMP/noevia-rs/bins/noevia-model-manager/src"; then
            echo "::error::the pinned noevia-rs still calls gpu-exec-probe; pin a noevia-rs that contains noevia-rs#192"
            exit 1
          fi
      - name: Fetch immutable test-only supervisor oracle
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG LEGACY_ORACLE_REF=//p' Dockerfile)
          sum=$(sed -n 's/^ARG LEGACY_ORACLE_SHA256=//p' Dockerfile)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] && [[ "$sum" =~ ^[0-9a-f]{64}$ ]]
          curl -fsSL -o "$RUNNER_TEMP/supervisor-oracle.tar.gz" "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$ref"
          echo "$sum  $RUNNER_TEMP/supervisor-oracle.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/noevia-rs-supervisor-oracle"
          tar -xzf "$RUNNER_TEMP/supervisor-oracle.tar.gz" -C "$RUNNER_TEMP/noevia-rs-supervisor-oracle" --strip-components=1
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ runner.temp }}/noevia-rs
      - name: Build tenant-assertion and workspace-restore-verify
        working-directory: ${{ runner.temp }}/noevia-rs
        run: cargo build --release --locked -p tenant-assertion-cli -p workspace-restore-verify-cli
      - name: Tenant-assertion fixtures match noevia-rs
        run: cmp tests/fixtures/tenant-assertion.v1.json "$RUNNER_TEMP/noevia-rs/crates/tenant-assertion/tests/fixtures/tenant-assertion.v1.json"
      - name: Diary test suite (with the tenant-assertion binary)
        env:
          TENANT_ASSERTION_BIN: ${{ runner.temp }}/noevia-rs/target/release/tenant-assertion
          TENANT_ASSERTION_REQUIRED: "1"
        run: python -m pytest -q -rs
      # workspace-restore-verify (WORKSPACE_RESTORE_VERIFY_IMPL=rust, noevia#982): same contract: the
      # fixture table is byte-identical to noevia-rs' copy, and the binary agrees with the live Python
      # module through the switch; the restore and import suites also pass with the switch on.
      - name: Differential test (workspace-restore-verify vs Python reference)
        env:
          WORKSPACE_RESTORE_VERIFY_BIN: ${{ runner.temp }}/noevia-rs/target/release/workspace-restore-verify
        run: |
          cmp tests/fixtures/workspace-restore.v1.json "$RUNNER_TEMP/noevia-rs/crates/workspace-restore-verify/tests/fixtures/workspace-restore.v1.json"
          python -m pytest -q -rs tests/test_workspace_restore_differential.py tests/test_workspace_restore_switch.py
          WORKSPACE_RESTORE_VERIFY_IMPL=rust python -m pytest -q tests/test_workspace_restore.py tests/test_workspace_import.py tests/test_workspace_trash.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (v3.12.0)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: ws/services/diary
          push: false
          cache-from: type=gha,scope=diary
          cache-to: type=gha,mode=max,scope=diary

  docling:
    name: Docling extraction contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws/services/docling
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/, the OCR test reading server/pdf-reduce.cjs) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          path: sib/noevia-core
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-services
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest==9.1.1 "pypdfium2!=4.30.1,>=4.30.0,<6.0.0"
      - run: python -m pytest -q
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - name: Docling runtime pins and frozen engine image guards
        # Host-only guards read this PR workflow; assembled services omit .github.
        working-directory: self/docling
        run: |
          rustc --edition=2021 --test tests/native_image.rs -o "$RUNNER_TEMP/docling-image-guards"
          "$RUNNER_TEMP/docling-image-guards"
      - name: Fetch actual merged Rust runtime
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG NOEVIA_RS_REF=//p' Dockerfile)
          sum=$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' Dockerfile)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL -o /tmp/docling-rs.tgz "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$ref"
          echo "$sum  /tmp/docling-rs.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/docling-rs"
          tar -xzf /tmp/docling-rs.tgz -C "$RUNNER_TEMP/docling-rs" --strip-components=1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ runner.temp }}/docling-rs
      - name: Actual HTTP worker binary default/native/featureless contracts
        working-directory: ${{ runner.temp }}/docling-rs
        env:
          NOEVIA_DOCLING_REFERENCE: ${{ github.workspace }}/ws/services/docling
        run: |
          cargo test --locked -p docling-service -p noevia-docling
          cargo test --locked -p noevia-docling --features native-docling
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Synthetic targets only. Never execute the model-bearing production layers in CI.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ws/services/docling
          target: native-contract
          push: false
          load: true
          tags: noevia-docling:ci
          cache-from: type=gha,scope=docling-native
          cache-to: type=gha,mode=max,scope=docling-native
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ws/services/docling
          target: omission-contract
          push: false
          load: true
          tags: noevia-docling:omission-ci
          cache-from: type=gha,scope=docling-native
      - name: Both image owners and specific capability omission (synthetic only)
        run: |
          set -euo pipefail
          compose=(docker compose -p docling-native-ci -f tests/native-runtime.compose.yml)
          cleanup() { "${compose[@]}" down --remove-orphans >/dev/null 2>&1 || true; docker rm -f docling-omission-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "${compose[@]}" up -d --wait --wait-timeout 60 --no-build
          "${compose[@]}" exec -T python native-image-probe python
          "${compose[@]}" exec -T rust native-image-probe rust
          if timeout --kill-after=2s 10s docker run --rm --name docling-omission-ci --network none --read-only --memory 1g --cpus 1 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 --tmpfs /tmp:rw,size=536870912,mode=1777 -e NOEVIA_DOCLING_IMPL=rust noevia-docling:omission-ci > "$RUNNER_TEMP/docling-omission.log" 2>&1; then
            echo 'featureless native image incorrectly started'; exit 1
          fi
          grep -Fq 'native-docling feature required' "$RUNNER_TEMP/docling-omission.log"
          echo 'specific featureless native image refusal passed'

  ocr:
    name: OCR service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws/services/ocr
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/, the OCR test reading server/pdf-reduce.cjs) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          path: sib/noevia-core
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-services
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install OCR engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu ghostscript poppler-utils
      - run: pip install pytest==9.1.1
      - run: python -m pytest -q -rs
      # docx-text (#981, sbstndalton/noevia-rs) at the Dockerfile's pinned ref, checksum-verified.
      # The model-manager image pins the same ref and checksum (release/versions.lock's
      # NOEVIA_RS_REF); the shared fixture table must be byte-identical in both repos, and the
      # binary must agree with the live Python reference on it.
      - name: OCR and model-manager pin the same noevia-rs
        run: |
          set -euo pipefail
          for k in NOEVIA_RS_REF NOEVIA_RS_SHA256; do
            a=$(sed -n "s/^ARG $k=//p" Dockerfile); b=$(sed -n "s/^ARG $k=//p" ../model-manager/Dockerfile)
            [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::ocr/Dockerfile $k ($a) != model-manager/Dockerfile ($b)"; exit 1; }
          done
      - name: Fetch noevia-rs at the pinned ref
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG NOEVIA_RS_REF=//p' Dockerfile)
          sum=$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' Dockerfile)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Dockerfile NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          curl -fsSL -o /tmp/noevia-rs.tar.gz "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$ref"
          echo "$sum  /tmp/noevia-rs.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/noevia-rs"
          tar -xzf /tmp/noevia-rs.tar.gz -C "$RUNNER_TEMP/noevia-rs" --strip-components=1
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ runner.temp }}/noevia-rs
      - name: Build docx-text and native OCR
        working-directory: ${{ runner.temp }}/noevia-rs
        run: cargo build --release --locked -p docx-text-cli -p noevia-ocr --features native-ocr
      - name: Native OCR synthetic contract and engine tests
        working-directory: ${{ runner.temp }}/noevia-rs
        env:
          NOEVIA_OCR_REFERENCE: ${{ github.workspace }}/ws/services/ocr
          NOEVIA_OCR_REAL_ENGINES: "1"
        run: cargo test --locked -p noevia-ocr --features native-ocr
      - name: Differential test (docx-text vs Python reference)
        env:
          DOCX_TEXT_BIN: ${{ runner.temp }}/noevia-rs/target/release/docx-text
        run: |
          for f in docx-text.v1.json docx-producers.v1.json; do
            cmp "tests/fixtures/$f" "$RUNNER_TEMP/noevia-rs/crates/docx-text/tests/fixtures/$f"
          done
          python -m pytest -q -rs -s test_docx_text_differential.py test_docx_text_switch.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (v3.12.0)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: ws/services/ocr
          push: false
          load: true
          tags: noevia-ocr:ci
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,mode=max,scope=ocr

      - name: Both OCR owners boot in the hardened image
        run: |
          set -eu
          for impl in python rust; do
            docker run -d --name ocr-ci --network none --read-only --memory 1g --cpus 1 --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 --tmpfs /tmp:rw,size=536870912,mode=1777 -e NOEVIA_OCR_IMPL="$impl" noevia-ocr:ci
            ready=0
            for attempt in $(seq 1 20); do
              if docker exec ocr-ci noevia-ocr --healthcheck; then ready=1; break; fi
              sleep 1
            done
            docker rm -f ocr-ci
            [ "$ready" = 1 ] || exit 1
          done
          if docker run --rm --network none -e NOEVIA_OCR_IMPL=invalid noevia-ocr:ci; then exit 1; fi

  laya:
    name: Laya service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws/services/laya
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/, the OCR test reading server/pdf-reduce.cjs) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          path: sib/noevia-core
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-services
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest==9.1.1
      - run: python -m pytest -q

  laya-image:
    name: Laya synthetic native image contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: rustfmt, clippy
      - name: Rust-owned source guard and bounded probe controls
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/laya-image-target
        run: |
          cargo fmt --manifest-path laya/qualification/Cargo.toml --check
          cargo clippy --locked --manifest-path laya/qualification/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path laya/qualification/Cargo.toml
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (v3.12.0)
      # These targets have no dependency on production pip/model layers.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: laya
          target: synthetic
          tags: noevia-laya-synthetic:ci
          push: false
          load: true
          cache-from: type=gha,scope=laya-synthetic
          cache-to: type=gha,mode=max,scope=laya-synthetic
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: laya
          target: synthetic-featureless
          tags: noevia-laya-featureless:ci
          push: false
          load: true
          cache-from: type=gha,scope=laya-synthetic
          cache-to: type=gha,mode=max,scope=laya-synthetic
      - name: Nonroot read-only network-none image qualification, synthetic ML only
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/laya-image-target
        run: cargo run --locked --manifest-path laya/qualification/Cargo.toml -- images noevia-laya-synthetic:ci noevia-laya-featureless:ci laya

  model-manager:
    name: Model manager test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws/services/model-manager
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/, the OCR test reading server/pdf-reduce.cjs) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-core
          path: sib/noevia-core
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-services
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
      # gguf-meta (sbstndalton/noevia-rs) at the Dockerfile's pinned ref, checksum-verified, then
      # compared with the Python parser (#909).
      - name: Fetch noevia-rs at the pinned ref
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG NOEVIA_RS_REF=//p' Dockerfile)
          sum=$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' Dockerfile)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Dockerfile NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          curl -fsSL -o /tmp/noevia-rs.tar.gz "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$ref"
          echo "$sum  /tmp/noevia-rs.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/noevia-rs"
          tar -xzf /tmp/noevia-rs.tar.gz -C "$RUNNER_TEMP/noevia-rs" --strip-components=1
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ runner.temp }}/noevia-rs
      # noevia#1071: model-files is the only repo-listing/backup implementation and the app refuses
      # to start without it, so every later step (the whole suite included) runs with it.
      - name: Build model-files for the app's startup check
        working-directory: ${{ runner.temp }}/noevia-rs
        run: |
          cargo build --release --locked -p model-files-cli
          ./target/release/model-files --help 2>&1 | grep -q usage
          echo "MODEL_FILES_BIN=$RUNNER_TEMP/noevia-rs/target/release/model-files" >> "$GITHUB_ENV"
      - name: Host ownership and remaining Python backend sampler
        run: python -m pytest -q tests/test_api_contract.py -k "backend_sampler_skips_only_confirmed_native_host or confirmed_host_refuses_direct_python_after_token_gate or default_python_host_contract_remains_available"
      - run: python -m pytest -q -k "not backend_sampler_skips_only_confirmed_native_host and not confirmed_host_refuses_direct_python_after_token_gate and not default_python_host_contract_remains_available"
      - name: Rust-owned actual prompt guards and startup seed ownership
        env:
          PROMPTS_TEST_PYTHON: python
        run: |
          rustfmt --edition 2021 --check qualification/prompts.rs
          clippy-driver --edition=2021 -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::indexing_slicing qualification/prompts.rs -o "$RUNNER_TEMP/prompts-guard-probe"
          rustc --edition=2021 --test qualification/prompts.rs -o "$RUNNER_TEMP/prompts-guard-tests"
          "$RUNNER_TEMP/prompts-guard-tests"
          rustfmt --edition 2021 --check qualification/prompts-image.rs
          clippy-driver --edition=2021 -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::indexing_slicing qualification/prompts-image.rs -o "$RUNNER_TEMP/prompts-image-probe"
          rustc --edition=2021 --test qualification/prompts-image.rs -o "$RUNNER_TEMP/prompts-image-tests"
          "$RUNNER_TEMP/prompts-image-tests" tests::marker_requires_canonical_data_preseed_and_exact_confirmation
          "$RUNNER_TEMP/prompts-image-tests" tests::cleanup_requires_exact_immutable_id_and_owned_label
          "$RUNNER_TEMP/prompts-image-tests" tests::send_budget_bounds_slow_progress_and_no_progress
          "$RUNNER_TEMP/prompts-image-tests" tests::failed_docker_diagnostics_are_fixed_and_reject_contamination --exact
          "$RUNNER_TEMP/prompts-image-tests" tests::readiness_requires_successful_owned_endpoints_before_deadline --exact
          rustfmt --edition 2021 --check qualification/prompts-mutations.rs
          clippy-driver --edition=2021 -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::indexing_slicing qualification/prompts-mutations.rs -o "$RUNNER_TEMP/prompts-guard-mutants"
          rustc --edition=2021 --test qualification/prompts-mutations.rs -o "$RUNNER_TEMP/prompts-mutant-classifier-tests"
          "$RUNNER_TEMP/prompts-mutant-classifier-tests" classifier_tests
          "$RUNNER_TEMP/prompts-guard-mutants" "$RUNNER_TEMP/prompts-guard-tests"
      - name: Rust-owned actual diagnosis refusal, default and composed guards
        env:
          DIAGNOSIS_TEST_PYTHON: python
        run: |
          rustfmt --edition 2021 --check qualification/diagnosis.rs qualification/diagnosis-image.rs
          clippy-driver --edition=2021 -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::indexing_slicing qualification/diagnosis.rs -o "$RUNNER_TEMP/diagnosis-guard-probe"
          rustc --edition=2021 --test qualification/diagnosis.rs -o "$RUNNER_TEMP/diagnosis-guard-tests"
          umask 077
          diagnosis_evidence="$RUNNER_TEMP/diagnosis-guard-evidence"
          mkdir -m 700 "$diagnosis_evidence"
          git -C "$GITHUB_WORKSPACE/self" rev-parse HEAD HEAD^{tree} > "$diagnosis_evidence/source.txt"
          sha256sum qualification/diagnosis.rs qualification/prompts.rs "$RUNNER_TEMP/diagnosis-guard-tests" > "$diagnosis_evidence/bindings.txt"
          run_diagnosis_exact() {
            local diagnosis_name="$1" diagnosis_test_exit diagnosis_record
            diagnosis_record="${diagnosis_name//:/_}"
            printf '%s\n' "$RUNNER_TEMP/diagnosis-guard-tests" "$diagnosis_name" --exact > "$diagnosis_evidence/$diagnosis_record.argv"
            if "$RUNNER_TEMP/diagnosis-guard-tests" "$diagnosis_name" --exact > "$diagnosis_evidence/$diagnosis_record.stdout" 2> "$diagnosis_evidence/$diagnosis_record.stderr"; then
              diagnosis_test_exit=0
            else
              diagnosis_test_exit=$?
            fi
            printf '%s\n' "$diagnosis_test_exit" > "$diagnosis_evidence/$diagnosis_record.status"
            [ "$diagnosis_test_exit" = 0 ] || { echo 'diagnosis exact test failed; raw evidence retained'; return 1; }
            [ "$(grep -Fxc 'running 1 test' "$diagnosis_evidence/$diagnosis_record.stdout")" = 1 ]
            [ "$(grep -Fxc "test $diagnosis_name ... ok" "$diagnosis_evidence/$diagnosis_record.stdout")" = 1 ]
            [ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$diagnosis_evidence/$diagnosis_record.stdout")" = 1 ]
            if grep -Ev "^$|^running 1 test$|^test $diagnosis_name \.\.\. ok$|^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$" "$diagnosis_evidence/$diagnosis_record.stdout" > /dev/null; then
              echo 'diagnosis exact test output grammar refused; raw evidence retained'; return 1
            fi
          }
          run_diagnosis_exact tests::actual_exact_confirmation_preserves_default_errors_and_unknowns
          run_diagnosis_exact tests::actual_token_precedes_method_and_path_ownership
          run_diagnosis_exact tests::actual_diagnosis_composes_with_existing_guards
          run_diagnosis_exact tests::actual_failed_fresh_create_preserves_preexisting_owned_sentinel
          clippy-driver --edition=2021 -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::indexing_slicing qualification/diagnosis-image.rs -o "$RUNNER_TEMP/diagnosis-image-probe"
          rustc --edition=2021 --test qualification/diagnosis-image.rs -o "$RUNNER_TEMP/diagnosis-image-tests"
          "$RUNNER_TEMP/diagnosis-image-tests" tests::confirmation_and_binding_are_exact --exact
      - name: Retain exact diagnosis guard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnosis-guard-exact-evidence
          path: ${{ runner.temp }}/diagnosis-guard-evidence
          retention-days: 7
          if-no-files-found: warn
      - name: Build helpers and mandatory native model-manager
        working-directory: ${{ runner.temp }}/noevia-rs
        run: |
          cargo build --release --locked -p gguf-meta -p model-files-cli -p model-autoconfig-cli -p noevia-model-manager --features noevia-model-manager/native-host,noevia-model-manager/native-sections,noevia-model-manager/native-prompts,noevia-model-manager/native-diagnose,noevia-model-manager/native-settings,noevia-model-manager/native-model-updates,noevia-model-manager/native-model-detail,noevia-model-manager/native-download-targets,noevia-model-manager/native-badges,noevia-model-manager/native-bench-runs,noevia-model-manager/native-section-writes,noevia-model-manager/native-settings-write,noevia-model-manager/native-backend-control,noevia-model-manager/native-benchmark-overview,noevia-model-manager/native-check-updates,noevia-model-manager/native-benchmark-runner,noevia-model-manager/native-downloads,noevia-model-manager/native-model-delete,noevia-model-manager/native-draft-heads,noevia-model-manager/native-backends,noevia-model-manager/native-model-list,noevia-model-manager/native-search,noevia-model-manager/native-section-autoconfig,noevia-model-manager/native-telemetry,noevia-model-manager/native-bench-observe,noevia-model-manager/native-db-init,noevia-model-manager/native-token-test,noevia-model-manager/native-safe-defaults,noevia-model-manager/native-download-plan,noevia-model-manager/native-routing
          ./target/release/noevia-model-manager --features | grep -Fx native-routing
          cp target/release/noevia-model-manager "$RUNNER_TEMP/model-manager-production"
      - name: Build frozen supervisor for historical Python differential contracts
        working-directory: ${{ runner.temp }}/noevia-rs-supervisor-oracle
        run: |
          cargo build --release --locked -p noevia-model-manager --features native-host,native-sections,native-prompts,native-diagnose
          cp target/release/noevia-model-manager "$RUNNER_TEMP/model-manager-native"
          cargo build --release --locked -p noevia-model-manager
          cp target/release/noevia-model-manager "$RUNNER_TEMP/model-manager-omission"
      - name: Check out immutable prompt oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          ref: 2360cb51f6475122ba0aa3d32272849a63028d66
          path: prompts-oracle
      - name: Native sections oracle and prompt startup, properties and Linux containment
        env:
          NOEVIA_PROMPTS_APP: ${{ github.workspace }}/prompts-oracle/model-manager/app
          PYTHON: python
        working-directory: ${{ runner.temp }}/noevia-rs
        run: |
          cargo run --locked -q -p noevia-model-manager --bin generate-sections-schema -- "$GITHUB_WORKSPACE/ws/services/model-manager/app" "$RUNNER_TEMP/sections-schema.json"
          cmp bins/noevia-model-manager/src/sections/schema.json "$RUNNER_TEMP/sections-schema.json"
          cargo run --locked -q -p noevia-model-manager --bin generate-sections-oracle -- "$GITHUB_WORKSPACE/ws/services/model-manager/app" "$RUNNER_TEMP/sections.json"
          cmp bins/noevia-model-manager/tests/fixtures/sections.json "$RUNNER_TEMP/sections.json"
          cargo test --locked -p noevia-model-manager --features native-host,native-sections,native-prompts
      - name: Sections capability omission preserves native host
        working-directory: ${{ runner.temp }}/noevia-rs
        run: cargo test --locked -p noevia-model-manager --features native-host --test lifecycle
      - name: Frozen supervisor and actual Python oracle (synthetic peers only)
        env:
          MODEL_MANAGER_BIN: ${{ runner.temp }}/model-manager-native
          MODEL_MANAGER_OMISSION_BIN: ${{ runner.temp }}/model-manager-omission
        run: python -m pytest -q -rs tests/test_native_runtime.py
      - name: Shipping native process, real stores and bounded shutdown
        env:
          MODEL_MANAGER_PRODUCTION_BIN: ${{ runner.temp }}/model-manager-production
        working-directory: ${{ runner.temp }}/noevia-rs
        run: cargo test --release --locked -p noevia-model-manager --features native-routing --test native_service
      - name: Differential test (gguf-meta vs Python parser)
        env:
          GGUF_META_BIN: ${{ runner.temp }}/noevia-rs/target/release/gguf-meta
          GGUF_META_FIXTURES: ${{ runner.temp }}/noevia-rs/crates/gguf/tests/fixtures
        run: python -m pytest -q -rs tests/test_gguf_meta_differential.py tests/test_gguf_parser_switch.py
      # #964: the shared fixture table must be byte-identical in both repos, and the binary must
      # reproduce its recorded expectations (the Python reference is at services 9c4bd37).
      - name: Recorded-oracle test (model-files vs the recorded Python expectations)
        env:
          MODEL_FILES_BIN: ${{ runner.temp }}/noevia-rs/target/release/model-files
        run: |
          cmp tests/fixtures/model-files.v1.json "$RUNNER_TEMP/noevia-rs/crates/model-files/tests/fixtures/model-files.v1.json"
          # #1021: model-files backups decides models.ini's recovery copies (always, noevia#1071).
          cmp tests/fixtures/model-backups.v1.json "$RUNNER_TEMP/noevia-rs/crates/model-files/tests/fixtures/model-backups.v1.json"
          python -m pytest -q -rs tests/test_model_files_differential.py tests/test_model_files_native.py tests/test_model_backups.py
      # MODEL_AUTOCONFIG: the shared fixtures (size core; input prep and values; slices 3-6) must be
      # byte-identical in both repos, and the binary must agree with the Python reference on them,
      # on seeded random corpora, and through analyze() (never an answer other than Python's).
      - name: Differential test (model-autoconfig vs Python autoconfig)
        env:
          MODEL_AUTOCONFIG_BIN: ${{ runner.temp }}/noevia-rs/target/release/model-autoconfig
        run: |
          cmp tests/fixtures/model-autoconfig.v1.json "$RUNNER_TEMP/noevia-rs/crates/model-autoconfig/tests/fixtures/model-autoconfig.v1.json"
          cmp tests/fixtures/model-autoconfig-check.v1.json "$RUNNER_TEMP/noevia-rs/crates/model-autoconfig/tests/fixtures/model-autoconfig-check.v1.json"
          cmp tests/fixtures/model-autoconfig-present.v1.json "$RUNNER_TEMP/noevia-rs/crates/model-autoconfig/tests/fixtures/model-autoconfig-present.v1.json"
          python -m pytest -q -rs tests/test_autoconfig_core_differential.py tests/test_autoconfig_core_switch.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (v3.12.0)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: ws/services/model-manager
          push: false
          load: true
          tags: noevia-model-manager:ci
          cache-from: type=gha,scope=model-manager
          cache-to: type=gha,mode=max,scope=model-manager
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: ws/services/model-manager
          target: qualification
          push: false
          load: true
          tags: noevia-model-manager-qualification:ci
          cache-from: type=gha,scope=model-manager
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: ws/services/model-manager
          target: native-qualification
          push: false
          load: true
          tags: noevia-model-manager-native-qualification:ci
          cache-from: type=gha,scope=model-manager
      - name: Actual native image process ownership and bounded shutdown
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,exec,size=67108864,mode=1777 \
            noevia-model-manager-native-qualification:ci
      - name: Frozen supervisor image section oracle and ownership
        run: |
          rustfmt --edition 2021 --check qualification/main.rs
          clippy-driver --edition=2021 -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::indexing_slicing qualification/main.rs -o "$RUNNER_TEMP/sections-image-probe"
          rustc --edition=2021 --test qualification/main.rs -o "$RUNNER_TEMP/sections-image-tests"
          "$RUNNER_TEMP/sections-image-tests"
          "$RUNNER_TEMP/sections-image-probe" images noevia-model-manager-qualification:ci
      - name: Frozen supervisor image prompt oracle and ownership
        run: '"$RUNNER_TEMP/prompts-image-probe" images noevia-model-manager-qualification:ci'
      - name: Frozen supervisor image diagnosis oracle and capability refusal
        run: '"$RUNNER_TEMP/diagnosis-image-probe" images noevia-model-manager-qualification:ci'
      - name: Actual native production image advertises compiled owner capabilities
        run: |
          native_features=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges noevia-model-manager:ci noevia-model-manager --features)
          printf '%s\n' "$native_features" | grep -Fx native-sections
          printf '%s\n' "$native_features" | grep -Fx native-prompts
          printf '%s\n' "$native_features" | grep -Fx native-diagnose
          printf '%s\n' "$native_features" | grep -Fx native-settings
          printf '%s\n' "$native_features" | grep -Fx native-routing
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/sh noevia-model-manager:ci -ec '! command -v python && ! command -v python3 && ! command -v uvicorn && test ! -e /srv/app && test ! -e /usr/local/bin/model-files && test ! -e /usr/local/bin/model-autoconfig'
          printf '%s\n' "$native_features" | grep -Fx native-model-updates
          printf '%s\n' "$native_features" | grep -Fx native-model-detail
          printf '%s\n' "$native_features" | grep -Fx native-download-targets
          printf '%s\n' "$native_features" | grep -Fx native-badges
          printf '%s\n' "$native_features" | grep -Fx native-bench-runs
          printf '%s\n' "$native_features" | grep -Fx native-section-writes
          printf '%s\n' "$native_features" | grep -Fx native-settings-write
          printf '%s\n' "$native_features" | grep -Fx native-backend-control
          printf '%s\n' "$native_features" | grep -Fx native-benchmark-overview
          printf '%s\n' "$native_features" | grep -Fx native-check-updates
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
