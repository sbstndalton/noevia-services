[package]
name = "laya-image-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

[dependencies]
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
nix = { version = "0.30", features = ["signal", "process"] }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
